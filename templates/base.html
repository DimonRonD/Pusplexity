<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Pusplexity{% endblock %}</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('ui-theme');
                var theme = saved === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (_e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090f1d;
            --bg-panel: #111a2e;
            --bg-input: #1a2743;
            --border: #253555;
            --text: #e8edf8;
            --text-muted: #a5b2ca;
            --accent: #4c8dff;
            --accent-hover: #6ca2ff;
            --success: #3fb950;
            --error: #f85149;
        }
        :root[data-theme="light"] {
            --bg-dark: #eef3ff;
            --bg-panel: #ffffff;
            --bg-input: #f4f7ff;
            --border: #d6e0f7;
            --text: #1e2a42;
            --text-muted: #5f6f8f;
            --accent: #3d74ea;
            --accent-hover: #5b89ec;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background:
                radial-gradient(1200px 700px at 15% -5%, rgba(76, 141, 255, 0.18), transparent 60%),
                radial-gradient(900px 500px at 90% -10%, rgba(125, 89, 255, 0.14), transparent 55%),
                var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            transition: background 0.25s ease, color 0.25s ease;
        }
        .glass-panel {
            background: rgba(17, 26, 46, 0.86);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
        }
        .btn-brand {
            background: linear-gradient(135deg, var(--accent), #7061ff);
            border: none;
            color: #fff;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
        .btn-brand:hover {
            color: #fff;
            transform: translateY(-1px);
            filter: brightness(1.05);
            box-shadow: 0 10px 22px rgba(76, 141, 255, 0.35);
        }
        .btn-brand:focus-visible {
            outline: 0;
            box-shadow: 0 0 0 0.2rem rgba(76, 141, 255, 0.3);
        }
        .form-control, .form-select {
            background: var(--bg-input);
            color: var(--text);
            border-color: var(--border);
        }
        .form-control::placeholder {
            color: var(--text-muted);
        }
        .form-control:focus, .form-select:focus {
            background: var(--bg-input);
            color: var(--text);
            border-color: var(--accent);
            box-shadow: 0 0 0 0.2rem rgba(76, 141, 255, 0.2);
        }
        .text-muted-ui {
            color: var(--text-muted);
        }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
