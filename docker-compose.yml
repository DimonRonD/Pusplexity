services:
  pusplexity:
    build: .
    container_name: pusplexity
    restart: unless-stopped
    env_file: .env
    environment:
      - BOT_DATA_PATH=/data/bot_data.pickle
      - LOG_DB_PATH=/app/db
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - bot_data:/data
      - bot_documents:/app/data
      - chroma_data:/app/chroma_db
      - user_db:/app/db
      # Код с хоста — обновление через git pull + restart без пересборки образа
      - ./bot.py:/app/bot.py:ro
      - ./processor.py:/app/processor.py:ro
      - ./rag_store.py:/app/rag_store.py:ro
      - ./auth.py:/app/auth.py:ro
      - ./web_app.py:/app/web_app.py:ro
      - ./user_db.py:/app/user_db.py:ro
      - ./action_logs.py:/app/action_logs.py:ro
      - ./telegram_format.py:/app/telegram_format.py:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
    # Для вывода логов в консоль добавьте -v:
    # command: ["python", "bot.py", "telegram", "-v"]

  pusplexity-web:
    build: .
    container_name: pusplexity-web
    restart: unless-stopped
    env_file: .env
    environment:
      - USERS_FILE=/app/users.txt
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - USER_DB_PATH=/app/db
      - LOG_DB_PATH=/app/db
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Временный fallback для прямого доступа во время миграции на Traefik.
    # После проверки https://pusplexity.dimonrond.ru удалите этот проброс.
    # ports:
    #   - "5000:5000"
    networks:
      - default
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.pusplexity.rule=Host(`pusplexity.dimonrond.ru`)
      - traefik.http.routers.pusplexity.entrypoints=websecure
      - traefik.http.routers.pusplexity.tls=true
      # Тот же certresolver, что у Traefik для n8n (иначе — самоподписанный cert и SEC_E_UNTRUSTED_ROOT в браузере).
      - traefik.http.routers.pusplexity.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.pusplexity.loadbalancer.server.port=5000
    volumes:
      - bot_documents:/app/data
      - chroma_data:/app/chroma_db
      - user_db:/app/db
      - ./users.txt:/app/users.txt:ro
      - ./bot.py:/app/bot.py:ro
      - ./processor.py:/app/processor.py:ro
      - ./rag_store.py:/app/rag_store.py:ro
      - ./auth.py:/app/auth.py:ro
      - ./web_app.py:/app/web_app.py:ro
      - ./user_db.py:/app/user_db.py:ro
      - ./action_logs.py:/app/action_logs.py:ro
      - ./telegram_format.py:/app/telegram_format.py:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
    command: ["gunicorn", "-w", "1", "-k", "gevent", "-b", "0.0.0.0:5000", "--timeout", "300", "--keep-alive", "5", "web_app:app"]

volumes:
  bot_data:
  bot_documents:
  chroma_data:
  user_db:

networks:
  n8n_default:
    external: true
