services:
  imagebot:
    build: .
    container_name: imagebot
    restart: unless-stopped
    env_file: .env
    environment:
      - BOT_DATA_PATH=/data/bot_data.pickle
    volumes:
      - bot_data:/data
      - bot_documents:/app/data
      - chroma_data:/app/chroma_db
    # Для вывода логов в консоль добавьте -v:
    # command: ["python", "bot.py", "telegram", "-v"]

  imagebot-web:
    build: .
    container_name: imagebot-web
    restart: unless-stopped
    env_file: .env
    environment:
      - USERS_FILE=/app/users.txt
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-this-secret-in-production}
    ports:
      - "5000:5000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.imagebot.rule=Host(`app.dimonrond.ru`)"
      - "traefik.http.routers.imagebot.entrypoints=web"
      - "traefik.http.services.imagebot.loadbalancer.server.port=5000"
    volumes:
      - bot_documents:/app/data
      - chroma_data:/app/chroma_db
      - ./users.txt:/app/users.txt
    command: ["gunicorn", "-w", "1", "-b", "0.0.0.0:5000", "--timeout", "300", "web_app:app"]
    networks:
      - traefik

# Сеть Traefik — уточните: docker network ls | grep -E "traefik|n8n"
networks:
  traefik:
    name: n8n_default
    external: true

volumes:
  bot_data:
  bot_documents:
  chroma_data:
